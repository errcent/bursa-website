# Dependabot auto-merge — DISABLED (BN-SEC-002)
#
# Auto-merge removed after 2026-08-14 security audit.
# Dependabot PRs (including security:update) require human review and merge.
# This workflow is retained as a no-op stub so the path stays documented;
# delete the file entirely once the team no longer needs the reminder.

name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  auto-merge-disabled:
    name: Auto-merge disabled (human review required)
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Skip auto-merge
        run: |
          echo "BN-SEC-002: Dependabot auto-merge is disabled."
          echo "Review and merge Dependabot PRs manually after CI passes."
