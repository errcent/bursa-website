name: Security Reviewer + Vulnerability Scanner

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-reviewer-codeql:
    name: Security Reviewer (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@adfda868f108ac4222129de456ea554034a27db7 # v4
        with:
          languages: javascript-typescript
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@adfda868f108ac4222129de456ea554034a27db7 # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@adfda868f108ac4222129de456ea554034a27db7 # v4
        with:
          category: security-reviewer-codeql

  security-reviewer-semgrep:
    name: Security Reviewer (Semgrep)
    runs-on: ubuntu-latest
    container:
      # U-011: pin version + multi-arch digest (semgrep 1.145.0)
      image: semgrep/semgrep:1.145.0@sha256:b68f9b68483955b85042dac7b4533757779625a02dcf91e470da4c2df1b430be
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0

      - name: Run Semgrep
        run: >
          semgrep scan
          --config p/typescript
          --config p/javascript
          --config p/react
          --config p/nextjs
          --config p/owasp-top-ten
          --config p/secrets
          --sarif
          --output semgrep.sarif

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@adfda868f108ac4222129de456ea554034a27db7 # v4
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: security-reviewer-semgrep

      - name: Upload Semgrep artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 30

  vulnerability-scanner-trivy:
    name: Vulnerability Scanner (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@adfda868f108ac4222129de456ea554034a27db7 # v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category: vulnerability-scanner-trivy

      - name: Upload Trivy artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          retention-days: 30

  vulnerability-scanner-osv:
    name: Vulnerability Scanner (OSV)
    # U-011: pin reusable workflow to commit SHA (v2.2.2)
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@90b209d0ea55cea1da9fc0c4e65782cc6acb6e2e
    with:
      scan-args: |-
        --lockfile=package-lock.json
      results-file-name: osv-results.sarif
      upload-sarif: true
      fail-on-vuln: false
